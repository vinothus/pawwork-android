<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PawCode</title>
<style>
  body { margin:0; font-family: sans-serif; background:#fff8ef; color:#222; }
  header { padding:18px 16px 10px; background:#fffdf8; border-bottom:1px solid #f0e2cf; }
  header h1 { margin:0; font-size:22px; color:#b45309; }
  header p { margin:6px 0 0; font-size:14px; color:#6b5a44; }
  .bar { display:flex; gap:10px; padding:10px 16px; }
  button { border:0; border-radius:8px; padding:10px 14px; font-size:14px; cursor:pointer; }
  .run   { background:#b45309; color:#fff; font-weight:bold; }
  .py    { background:#6d28d9; color:#fff; }
  .toast { background:#eee4d0; color:#5b4a35; }
  .panes { display:flex; flex-direction:column; gap:10px; padding:0 16px 16px; }
  .pane { border:1px solid #eee0cc; border-radius:10px; background:#fff; overflow:hidden; }
  .pane h2 { margin:0; font-size:12px; text-transform:uppercase; letter-spacing:.08em;
             color:#a97f4f; background:#fbf3e4; padding:6px 10px; }
  #log { min-height:120px; max-height:240px; overflow:auto; margin:0; padding:10px;
         font:12px/1.5 ui-monospace, Menlo, Consolas, monospace; color:#334155; white-space:pre-wrap; }
  #result { min-height:48px; padding:10px; font:13px/1.5 ui-monospace, Menlo, Consolas, monospace;
            color:#166534; background:#f4fbf4; white-space:pre-wrap; word-break:break-word; }
  .err { color:#b91c1c; background:#fef2f2; }
  #code { display:none; }
</style>
</head>
<body>
<header>
  <h1 id="label">PawCode App</h1>
  <p id="message">Built by PawWork build_apk</p>
</header>
<div class="bar">
  <button class="run" id="runBtn" onclick="runOne()">▶ Run code</button>
  <button class="py" id="pyBtn" style="display:none" onclick="runOne()">🐍 Run Python</button>
  <button class="toast" onclick="try { Tpl.toast(document.getElementById('message').textContent); } catch(e){}">Made with PawWork 🐾</button>
</div>
<div class="panes">
  <div class="pane"><h2>Output</h2><pre id="log"></pre></div>
  <div class="pane"><h2>Result</h2><pre id="result"></pre></div>
</div>
<pre id="code"></pre>

<script>
var CFG = null;
var pyodide = null;
var canvasCtx = null;

function $(id) { return document.getElementById(id); }

function logLine(s) {
  var pre = $('log');
  pre.textContent += (pre.textContent.length && !pre.textContent.endsWith('\n') ? '\n' : '') + String(s);
  pre.scrollTop = pre.scrollHeight;
}
function showResult(s, isErr) {
  var r = $('result');
  r.textContent = String(s);
  r.className = isErr ? 'err' : '';
}

function makeCanvas() {
  try {
    var c = document.createElement('canvas');
    var ctx = c.getContext('2d');
    return { canvas: c, ctx: ctx };
  } catch (e) { return null; }
}

// ---- JavaScript mode: Paw API for the embedded functionality ----
var Paw = {
  log: function (m) { logLine(m); },
  text: function (m) { showResult(m); },
  // returns {ok, data, encoding, bytes} — binary files come back base64
  read: function (p) { return JSON.parse(Tpl.fsRead(String(p))); },
  // mode 'b64' writes base64 payload; default writes text
  write: function (p, d, mode) { return JSON.parse(Tpl.fsWrite(String(p), (mode === 'b64' ? 'b64:' : '') + String(d))); },
  list: function (p) { return JSON.parse(Tpl.fsList(String(p || ''))); },
  canvas: function () { return makeCanvas(); },
  toast: function (m) { Tpl.toast(String(m)); }
};

// ---- Python mode (Pyodide embedded by build_apk when lang=python) ----
function installPyHooks() {
  try {
    pyodide.globals.set('paw_read', function (p) { return Tpl.fsRead(String(p)); });
    pyodide.globals.set('paw_write', function (p, d) { return Tpl.fsWrite(String(p), String(d)); });
    pyodide.globals.set('paw_list', function (p) { return Tpl.fsList(String(p || '')); });
    pyodide.globals.set('js_eval', function (e) { return eval(String(e)); });
  } catch (err) { logLine('fs hooks failed: ' + err); }
}

function execPy() {
  logLine('pyodide ' + (pyodide ? 'ready' : 'loading') + ' — running…');
  var t0 = Date.now();
  try {
    pyodide.setStdout({ batched: function (s) { logLine(s); } });
    pyodide.setStderr({ batched: function (s) { logLine(s); } });
  } catch (e) { /* old pyodide */ }
  try {
    var r = pyodide.runPython($('code').textContent);
    var extra = (r === undefined || r === null) ? '' : String(r);
    showResult((extra ? 'python returned: ' + extra : 'done') + '  (' + ((Date.now() - t0) / 1000).toFixed(1) + 's)');
  } catch (e) { showResult('python error: ' + e, true); }
}

function loadPyodideRuntime() {
  logLine('loading embedded python runtime (~15 MB)…');
  loadPyodide({ indexURL: 'https://appassets.androidplatform.net/assets/pyodide/' }).then(function (p) {
    pyodide = p;
    installPyHooks();
    logLine('python ready — ' + p.version);
    execPy();
  }).catch(function (e) {
    showResult('python runtime failed to load: ' + e, true);
  });
}

function runJavaScriptOnce() {
  var t0 = Date.now();
  try {
    var fn = new Function('Paw', 'log', 'canvas', $('code').textContent);
    var out = fn(Paw, logLine, makeCanvas);
    if (out !== undefined && out !== null) showResult(String(out) + '  (' + ((Date.now() - t0) / 1000).toFixed(1) + 's)');
    else showResult('done  (' + ((Date.now() - t0) / 1000).toFixed(1) + 's)');
  } catch (e) {
    showResult('js error: ' + e, true);
  }
}

function runOne() {
  if (!CFG) return;
  $('result').textContent = '';
  $('result').className = '';
  if (CFG.lang === 'python') {
    if (typeof loadPyodide === 'undefined') {
      showResult('python runtime is not embedded in this APK (build with build_apk lang=python)', true);
      return;
    }
    if (pyodide) execPy(); else loadPyodideRuntime();
  } else {
    runJavaScriptOnce();
  }
}

// ---- init: read config, render, auto-run on launch (and on re-open) ----
try {
  CFG = JSON.parse(Tpl.getConfig());
  $('label').textContent = CFG.label || 'PawCode App';
  $('message').textContent = CFG.message || '';
  $('code').textContent = CFG.code || '';
  if (CFG.lang === 'python') $('pyBtn').style.display = '';
  logLine('config: lang=' + (CFG.lang || 'js') + ' code=' + (CFG.code || '').length + ' chars');
  runOne();
} catch (e) {
  showResult('config error: ' + e, true);
}
</script>
</body>
</html>
